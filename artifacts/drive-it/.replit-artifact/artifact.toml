kind = "mobile"
previewPath = "/"
title = "Drive It Kenya"
version = "1.0.0"
id = "artifacts/drive-it"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 26239

[services.development]
run = "pnpm --filter @workspace/drive-it run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/drive-it", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/drive-it", "run", "serve" ]

[services.env]
PORT = "26239"
BASE_PATH = "/"
